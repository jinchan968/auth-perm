name: Deploy to GCP VPS

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/auth-perm-linux cmd/api/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/auth-perm-worker-linux cmd/worker/main.go

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: 'bin/auth-perm-linux,bin/auth-perm-worker-linux'
          target: '/opt/auth-perm/'
          strip_components: 1

      - name: Restart services
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "[1/4] 检查上传的文件..."
            ls -la /opt/auth-perm/auth-perm-linux /opt/auth-perm/auth-perm-worker-linux
            echo "[2/4] 赋予执行权限..."
            chmod +x /opt/auth-perm/auth-perm-linux /opt/auth-perm/auth-perm-worker-linux
            echo "[3/4] 重启 API 服务..."
            sudo systemctl restart auth-perm-api
            echo "[4/4] 重启 Worker 服务..."
            sudo systemctl is-enabled auth-perm-worker && sudo systemctl restart auth-perm-worker || echo "Worker 未启用，跳过"
            echo "Deploy done"
